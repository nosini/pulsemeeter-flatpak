id: eu.nosini.Pulsemeeter
branch: stable
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pulsemeeter
build-options:
  # The only native code comes from prebuilt wheels; a .Debug extension would
  # contain nothing useful.
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # PulseAudio protocol (pulsectl): volumes, mutes, default devices, moving
  # app streams. pipewire-pulse only grants a Flatpak client control over
  # other clients' streams and devices when the app has access to all devices.
  - --socket=pulseaudio
  - --device=all
  # Native PipeWire for pw-cli, pw-link, pw-loopback, pw-dump and pw-metadata.
  # The bundled client.conf marks these clients as media.category=Manager, which
  # WirePlumber requires before giving a Flatpak client more than read access.
  - --filesystem=xdg-run/pipewire-0
  - --env=PIPEWIRE_CONFIG_DIR=/app/share/pulsemeeter/pipewire
  # Read-only host /usr at /run/host/usr, for app icons outside
  # /usr/share/icons (e.g. /usr/local/share/icons from xdg-icon-resource).
  # Patch 0003 adds those folders to GTK's icon search path.
  - --filesystem=host-os:ro
  # Same configuration file as a native install, so either can be used.
  - --filesystem=xdg-config/pulsemeeter:create
  # Pulsemeeter's GtkApplication ID differs from the Flatpak ID.
  - --own-name=org.pulsemeeter.pulsemeeter
modules:
  - python-build-packages.json
  - python-packages.json

  - name: pulsemeeter
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix="${FLATPAK_DEST}" .
      # The upstream launchers aren't exported (wrong prefix); ours replaces them.
      - rm "${FLATPAK_DEST}"/share/applications/*.desktop
      - install -Dm644 eu.nosini.Pulsemeeter.desktop -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 eu.nosini.Pulsemeeter.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo"
      # Exported icons need the app ID as their name. These are the upstream
      # icons padded to a square; the upstream Pulsemeeter.png icons stay
      # installed because the welcome window looks them up by that name.
      - |
        for icon in icons/*/eu.nosini.Pulsemeeter.png; do
          size=$(basename "$(dirname "${icon}")")
          install -Dm644 "${icon}" -t "${FLATPAK_DEST}/share/icons/hicolor/${size}/apps"
        done
    sources:
      - type: git
        url: https://github.com/theRealCarneiro/pulsemeeter.git
        tag: v2.2.0
        commit: 16660cc229b1ed905a9d859c7b1e5b5973c0c233
      - type: patch
        path: patches/0001-detect-pipewire-pulse-through-the-server.patch
      - type: patch
        path: patches/0002-find-translations-installed-under-app.patch
      - type: patch
        path: patches/0003-find-app-icons-installed-on-the-host.patch
      - type: file
        path: eu.nosini.Pulsemeeter.desktop
      - type: file
        path: eu.nosini.Pulsemeeter.metainfo.xml
      - type: dir
        path: icons
        dest: icons

  # PipeWire client configuration for the pw-* tools: the runtime's defaults
  # plus the Manager role (see finish-args).
  - name: pipewire-client-config
    buildsystem: simple
    build-commands:
      - install -Dm644 /usr/share/pipewire/client.conf -t "${FLATPAK_DEST}/share/pulsemeeter/pipewire"
      - install -Dm644 50-manager.conf -t "${FLATPAK_DEST}/share/pulsemeeter/pipewire/client.conf.d"
    sources:
      - type: file
        path: pipewire/50-manager.conf
