name: Update

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update

env:
  APP_ID: eu.nosini.Pulsemeeter
  APP_NAME: Pulsemeeter

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      # Push the update branch, open its pull request, start its build and,
      # with AUTO_MERGE_UPDATES, merge it.
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: update/upstream
    defaults:
      run:
        # Unlike the default shell, this one fails on errors inside pipelines.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # flatpak-external-data-checker follows each source's x-checker-data,
      # updates the manifest pins and adds the main source's release to the
      # metainfo file.
      - name: Check sources for updates
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GITHUB_TOKEN \
            -v "$PWD:/work" -w /work \
            ghcr.io/flathub/flatpak-external-data-checker:latest \
            --edit-only "$APP_ID.yml" 2>&1 | tee "$RUNNER_TEMP/checker.log"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Propose the update
        id: propose
        run: |
          if git diff --quiet; then
            echo 'All sources are up to date.'
            exit 0
          fi
          # Leave an identical pending update alone instead of rebuilding it.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD; then
            echo "$BRANCH already contains this update."
            exit 0
          fi

          version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' "$APP_ID.metainfo.xml" | head -1)
          if git diff --quiet -- "$APP_ID.metainfo.xml"; then
            title="Update $APP_NAME sources"
          else
            title="Update $APP_NAME to $version"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -qam "$title"
          git push --force origin "$BRANCH"

          {
            echo 'flatpak-external-data-checker found these changes:'
            echo
            echo '```'
            grep -vE '^\s*$' "$RUNNER_TEMP/checker.log" | tail -n 40
            echo '```'
            echo
            echo 'Check the build of this branch, and try its bundle artifact, before merging.'
          } > "$RUNNER_TEMP/body.md"
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

          # Pushes made with GITHUB_TOKEN don't start other workflows; a
          # dispatch does, and its result shows on the pull request's commit.
          gh workflow run flatpak.yml --ref "$BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge the update after a successful build
        if: steps.propose.outputs.commit && vars.AUTO_MERGE_UPDATES == 'true'
        env:
          COMMIT: ${{ steps.propose.outputs.commit }}
        run: |
          run=
          for _ in $(seq 30); do
            run=$(gh run list --workflow flatpak.yml --commit "$COMMIT" --event workflow_dispatch \
              --json databaseId --jq '.[0].databaseId // empty')
            [[ -n "$run" ]] && break
            sleep 10
          done
          test -n "$run"
          gh run watch "$run" --exit-status --interval 60 > /dev/null
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$COMMIT"
          # The merge was made with GITHUB_TOKEN too, so start the publishing
          # build on main explicitly.
          gh workflow run flatpak.yml --ref main
