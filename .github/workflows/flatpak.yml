name: Flatpak

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      update_upstream:
        description: Check for a new upstream stable release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.upstream.outputs.changed != 'false' }}
      changed: ${{ steps.upstream.outputs.changed }}
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the release updater
        run: python3 scripts/test-update-upstream.py

      - name: Check upstream stable release
        id: upstream
        if: github.event_name == 'schedule' || inputs.update_upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-upstream.py

      - uses: actions/upload-artifact@v7
        if: steps.upstream.outputs.changed == 'true'
        with:
          name: upstream-update
          path: |
            flatpak/eu.nosini.Pulsemeeter.yml
            flatpak/eu.nosini.Pulsemeeter.metainfo.xml
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # Bubblewrap needs namespaces unavailable in an ordinary Docker container.
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.changed == 'true'
        with:
          name: upstream-update
          path: flatpak

      - name: Install SDK and runtime
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51

      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --arch=x86_64 \
            --repo=repo build-dir flatpak/eu.nosini.Pulsemeeter.yml

      - name: Check software-center metadata
        run: |
          flatpak build-update-repo repo
          flatpak --user remote-add --no-gpg-verify local-test "$PWD/repo"
          flatpak --user update --appstream local-test
          python3 scripts/check-appstream.py \
            "${XDG_DATA_HOME:-$HOME/.local/share}/flatpak/appstream/local-test/x86_64/active"

      - name: Check the installed app against its runtime
        run: bash scripts/test-installed.sh

      - name: Create installable bundle
        run: |
          flatpak build-bundle --arch=x86_64 \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo pulsemeeter-x86_64.flatpak eu.nosini.Pulsemeeter stable

      - uses: actions/upload-artifact@v7
        with:
          name: pulsemeeter-x86_64
          path: pulsemeeter-x86_64.flatpak
          if-no-files-found: error

      - name: Check the update still matches main
        if: needs.prepare.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          BASE_COMMIT: ${{ github.sha }}
        run: bash scripts/check-main.sh "$BASE_COMMIT"

      - name: Import signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_FLATPAK == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo 'Set FLATPAK_GPG_PRIVATE_KEY before enabling PUBLISH_FLATPAK.' >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/pulsemeeter-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" && !key { key = $10 } END { print key }')
          test -n "$key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY=$key" >> "$GITHUB_ENV"

      - name: Sign and prepare update repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_FLATPAK == 'true'
        env:
          REPO_URL: ${{ vars.FLATPAK_REPO_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: bash scripts/prepare-repository.sh

      - name: Verify signed software catalog
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_FLATPAK == 'true'
        run: |
          public_key_file="$RUNNER_TEMP/pulsemeeter-signing-public-key.gpg"
          gpg --batch --export --export-options export-minimal "$GPG_KEY" > "$public_key_file"
          test -s "$public_key_file"
          flatpak --user remote-add --gpg-import="$public_key_file" signed-test "$PWD/signed-repo"
          flatpak --user update --appstream signed-test
          python3 scripts/check-appstream.py \
            "${XDG_DATA_HOME:-$HOME/.local/share}/flatpak/appstream/signed-test/x86_64/active"
          flatpak --user remote-delete signed-test
          rm -f "$public_key_file"

      - name: Remove imported key
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/pulsemeeter-gnupg" ]]; then
            GNUPGHOME="$RUNNER_TEMP/pulsemeeter-gnupg" gpgconf --kill all || true
            rm -rf "$RUNNER_TEMP/pulsemeeter-gnupg"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_FLATPAK == 'true'
        with:
          path: signed-repo

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_FLATPAK == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check main immediately before publishing
        env:
          BASE_COMMIT: ${{ github.sha }}
        run: bash scripts/check-main.sh "$BASE_COMMIT"

      - id: deployment
        uses: actions/deploy-pages@v5

  record-update:
    needs: [prepare, build, deploy]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.changed == 'true' && needs.build.result == 'success' &&
      (needs.deploy.result == 'success' ||
      (needs.deploy.result == 'skipped' && vars.PUBLISH_FLATPAK != 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: upstream-update
          path: flatpak

      - name: Record the tested upstream release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flatpak/eu.nosini.Pulsemeeter.yml flatpak/eu.nosini.Pulsemeeter.metainfo.xml
          git -c commit.gpgsign=false commit -m "Update Pulsemeeter to $RELEASE_TAG"
          # A normal push refuses to overwrite changes made while this run was active.
          git push origin HEAD:main
