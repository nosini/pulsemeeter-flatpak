name: Checks

# Lints and tests the packaging scripts and workflows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # The runtimes' Python.
          python-version: '3.14'

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh scripts/tests/*.sh tests/check-installed.sh

      - name: Lint workflows
        run: |
          # Pinned by checksum, so a replaced release asset can't run here.
          tarball=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$tarball"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/$tarball" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Parse the manifest and metadata files
        run: |
          pip install -q pyyaml packaging
          python - <<'EOF'
          import glob, json, xml.etree.ElementTree as ET, yaml
          for path in glob.glob("*.yml") + glob.glob(".github/**/*.yml", recursive=True):
              yaml.safe_load(open(path))
          for path in glob.glob("*.json"):
              json.load(open(path))
          for path in glob.glob("*.xml") + glob.glob("*.svg"):
              ET.parse(path)
          EOF

      - name: Test the requirement filter
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Test the update script
        run: bash scripts/tests/test-update-upstream.sh

      - name: Test release tag classification and creation
        run: python scripts/tests/test-release-workflow.py

      - name: Test the Python dependency generator
        env:
          PIP_GENERATOR_PYTHON: python
        run: bash scripts/tests/test-generate-python-deps.sh

  publishing:
    runs-on: ubuntu-24.04
    container:
      # The image the publish job uses, with flatpak, ostree and gpg.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test the publishing script
        run: bash scripts/tests/test-prepare-repository.sh
